schema_version: 1

experiment:
  id: four_round_small_sample_validation
  seed: 20260705
  rounds: 4
  continue_after_rejection: true
  output_root: runs/multibatch_validation
  report_root: reports/multibatch_validation

dataset:
  source_split: splits/train.txt
  base_splits:
    - splits/train.txt
    - splits/dev_val.txt
  source_global_class_id: 2
  class_name: warship
  sensors: [ir, sar]
  round_plan:
    - train: {ir: 20, sar: 20}
      val: {ir: 2, sar: 2}
      lock: {ir: 2, sar: 2}
    - train: {ir: 14, sar: 4}
      val: {ir: 2, sar: 2}
      lock: {ir: 2, sar: 2}
    - train: {ir: 14, sar: 4}
      val: {ir: 2, sar: 2}
      lock: {ir: 2, sar: 2}
    - train: {ir: 14, sar: 4}
      val: {ir: 2, sar: 2}
      lock: {ir: 2, sar: 2}

agent:
  base_config: configs/agent_pipeline.yaml
  base_registry: models/generations.json
  python: /home/sakauma/data/miniconda3/envs/sam_hq2_dinov3/bin/python
  device: "0"
  max_specialists_per_image: 4

training:
  imgsz: 512
  batch: 16
  epochs: 50
  patience: 15
  workers: 4
  optimizer: AdamW
  lr0: 0.001
  deterministic: true
  amp: true

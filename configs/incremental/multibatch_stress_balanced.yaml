schema_version: 1

experiment:
  id: balanced_micro_8r
  seed: 20260716
  rounds: 8
  continue_after_rejection: false
  output_root: runs/multibatch_validation
  report_root: reports/multibatch_validation

dataset:
  # 历史压力实验固定在归档旧划分，不代表当前严格 3+1 测试结果。
  source_split: archive/splits_legacy_random_560_95_95/train.txt
  base_splits: [archive/splits_legacy_random_560_95_95/train.txt, archive/splits_legacy_random_560_95_95/dev_val.txt]
  source_global_class_id: 2
  class_name: warship
  sensors: [ir, sar]
  round_plan:
    - {train: {ir: 12, sar: 12}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 3}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 3}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 3}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 3}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 3}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 3}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}
    - {train: {ir: 6, sar: 2}, val: {ir: 1, sar: 1}, lock: {ir: 1, sar: 1}}

agent: &agent
  base_config: configs/agent_pipeline.yaml
  base_registry: models/generations.json
  python: /home/sakauma/data/miniconda3/envs/sam_hq2_dinov3/bin/python
  device: "0"
  max_specialists_per_image: 4

training: &training
  imgsz: 512
  batch: 16
  epochs: 50
  patience: 15
  workers: 4
  optimizer: AdamW
  lr0: 0.001
  deterministic: true
  amp: true

schema_version: 1
generation_registry: models/generations.json

models:
  - id: scene_sensor_net_v1
    function: context_perception
    display_name: 场景与传感器认知模型
    implementation: multitask_cnn
    status: verified
    inputs: [image_rgb]
    outputs: [sensor_ir_sar, scene_air_forest_sea_urban, confidence]
    artifacts:
      - path: models/context/scene_sensor_net.pt
        sha256: 926baa7c5d4ebf70ebbe143a425490101aa563eecf36ef56d895db68aa23dc72
    evidence:
      path: models/context/scene_sensor_metrics.json
      sha256: 34171ef39af05bd2fa41a853f95d69bb50d42d09045a3f75a7ba70368a611a14
      require_acceptance_passed: true
    runtime:
      x86_gpu: true
      ascend_310b: false

  - id: unified_yolo11s_v1
    function: multimodal_target_detection
    display_name: IR/SAR 统一目标检测模型
    implementation: yolo11s
    status: verified
    inputs: [image_rgb]
    outputs: [boxes, class_ids, confidence]
    artifacts:
      - path: models/base/yolo11s_ir_sar_imgsz640.pt
        sha256: 387d885a07797dea4a65900bc6f80ab380f1926eef622904331a151470b6f31c
    evidence:
      path: models/manifest.json
      sha256: fb62f7d66b30e3264036b3c2a3062fc8ceeed5bf70c7f52a3bf0fc442d2c5ad8
    runtime:
      x86_gpu: true
      ascend_310b: false

  - id: incremental_model_bank_v1
    function: incremental_object_detection
    display_name: 增量目标检测模型库
    implementation: mode_aware_incremental_router_and_specialist_bank
    status: verified
    inputs: [incremental_images_labels, frozen_base_weights, class_focus]
    outputs: [incremental_boxes, incremental_mode, routing_trace, new_map50, krr, acceptance]
    artifacts:
      - path: models/production/incremental_detection/incremental_detector.pt
        sha256: 88f8af94fd548f318c12202bc99d4675a947b9144e456e9bd4b9ca3b05615dd3
    evidence:
      path: models/manifest.json
      sha256: fb62f7d66b30e3264036b3c2a3062fc8ceeed5bf70c7f52a3bf0fc442d2c5ad8
    runtime:
      x86_gpu: true
      ascend_310b: false

collaboration:
  - from: scene_sensor_net_v1
    to: unified_yolo11s_v1
    payload: agent_policy_context
    status: implemented
    proof_command: python -m fair_agent.cli decide --source IMAGE --class-focus soldier
    purpose: 认知概率作为软路由分数参与专项模型排序，不作为场景硬拒绝条件
  - from: unified_yolo11s_v1
    to: incremental_model_bank_v1
    payload: weak_class_and_error_cases
    status: implemented
    purpose: 基础检测为目标增量专项模型提供候选类别证据；真正新类协议不依赖旧模型同类框
  - from: incremental_model_bank_v1
    to: unified_yolo11s_v1
    payload: gated_incremental_predictions
    status: implemented
    proof_command: python -m pytest -q tests/test_web_inference.py tests/test_web_ui_flow.py
    purpose: Agent 执行已上线的增量检测器，以逐框 NMS 融合冻结基础结果和历次注入后登记的新类候选

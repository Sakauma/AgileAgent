schema_version: 1
generation_registry: models/generations.json

models:
  - id: scene_sensor_net_v1
    function: context_perception
    display_name: 场景与传感器认知模型
    implementation: multitask_cnn
    status: verified
    inputs: [image_rgb]
    outputs: [sensor_ir_sar, scene_air_forest_sea_urban, confidence]
    artifacts:
      - path: models/context/scene_sensor_net.pt
        sha256: 926baa7c5d4ebf70ebbe143a425490101aa563eecf36ef56d895db68aa23dc72
    evidence:
      path: models/context/scene_sensor_metrics.json
      sha256: 34171ef39af05bd2fa41a853f95d69bb50d42d09045a3f75a7ba70368a611a14
      require_acceptance_passed: true
    runtime:
      x86_gpu: true
      ascend_310b: false

  - id: three_class_base_detector
    function: multimodal_target_detection
    display_name: 三类冻结基础检测器
    implementation: yolo11s
    status: verified
    inputs: [image_rgb]
    outputs: [old_class_boxes, class_ids, confidence]
    artifacts:
      - path: models/production/incremental_detection/three_class_base_detector.pt
        sha256: 1056906c1545737192e50f18df7b2921da5beb7517730c40af7cc4abc21dbf96
    evidence:
      path: models/manifest.json
      sha256: 6e57fa80fb4735f00bf5da0280d77822276783d16a9e7ed6d40df8f34e288f4e
    runtime:
      x86_gpu: true
      ascend_310b: false
      imgsz: 896

  - id: incremental_model_bank_v1
    function: incremental_object_detection
    display_name: 增量目标检测模型库
    implementation: parallel_frozen_base_and_incremental_experts
    status: verified
    inputs: [incremental_images_labels, frozen_base_weights]
    outputs: [new_class_boxes, routing_trace, new_map50, krr, acceptance]
    artifacts:
      - path: models/production/incremental_detection/incremental_detector.pt
        sha256: 92ddcdcc4b17216d734f1033ab0157e87ac187da2a437d6cbb81642dde115adc
    evidence:
      path: models/manifest.json
      sha256: 6e57fa80fb4735f00bf5da0280d77822276783d16a9e7ed6d40df8f34e288f4e
    runtime:
      x86_gpu: true
      ascend_310b: false
      imgsz: 640

collaboration:
  - from: scene_sensor_net_v1
    to: three_class_base_detector
    payload: agent_policy_context
    status: implemented
    proof_command: python -m fair_agent.cli decide --source IMAGE --class-focus soldier
    purpose: 场景与传感器结果只作解释性上下文，不决定目标类别 owner 是否运行
  - from: three_class_base_detector
    to: incremental_model_bank_v1
    payload: parallel_old_class_predictions
    status: implemented
    purpose: 基础 owner 与全部增量 owner 对每张未知图并行推理
  - from: incremental_model_bank_v1
    to: three_class_base_detector
    payload: fixed_class_owner_box_fusion
    status: implemented
    proof_command: python -m pytest -q tests/test_web_inference.py tests/test_web_ui_flow.py
    purpose: 仅按固定类别所有权、置信度与框重叠关系融合，不读取标签、文件名或场景类别

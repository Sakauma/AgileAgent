collaboration:
  - from: scene_sensor_net_v1
    to: unified_yolo11s_v1
    payload: agent_policy_context
    status: implemented
    proof_command: python -m fair_agent.cli decide --source IMAGE --class-focus soldier
    purpose: 认知概率作为软路由分数参与专项模型排序，不作为场景硬拒绝条件
  - from: unified_yolo11s_v1
    to: incremental_model_bank_v1
    payload: weak_class_and_error_cases
    status: implemented
    purpose: 基础检测为目标增量专项模型提供候选类别证据；真正新类协议不依赖旧模型同类框
  - from: incremental_model_bank_v1
    to: unified_yolo11s_v1
    payload: gated_incremental_predictions
    status: implemented
    proof_command: python -m pytest -q tests/test_web_inference.py tests/test_web_ui_flow.py
    purpose: Agent 按增量模式执行门控，以逐框 NMS 融合基础结果和专项候选；当前专项权重仅作为目标增量演练

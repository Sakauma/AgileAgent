    display_name: IR/SAR 统一目标检测模型
    implementation: yolo11s
    status: verified
    inputs: [image_rgb]
    outputs: [boxes, class_ids, confidence]
    artifacts:
      - path: models/base/yolo11s_ir_sar_imgsz640.pt
        sha256: 387d885a07797dea4a65900bc6f80ab380f1926eef622904331a151470b6f31c
    evidence:
      path: models/manifest.json
      sha256: 81b5b26248c9aabb7b3e934fa09d6f62273f222e4c83eb1406f49621e96fdd59
    runtime:
      x86_gpu: true
      ascend_310b: false

  - id: incremental_model_bank_v1
    function: incremental_object_detection
    display_name: 增量目标检测模型库
    implementation: incremental_data_only_frozen_base_plus_class_specialists
    status: partially_verified
    inputs: [incremental_images_labels, frozen_base_weights, class_focus]
    outputs: [incremental_boxes, incremental_mode, new_map50, krr, acceptance]
    artifacts:
      - path: models/incremental/p01_new_small_aircraft_best.pt
        sha256: dec95184c44d168bfe5b3760cf55fa71fdbd93ff8fdd4542be63c32a6233f37b
      - path: models/incremental/p02_new_warship_best.pt
        sha256: 03f4a68f85647bb33b4be043e32c9c4f74adfd3887bf22d63c3471e236af6a1e
      - path: models/incremental/p03_new_tank_best.pt
        sha256: 5ee5e4866772f1c28d5aad7608636c7b40284033de12ed7ba1185f7b431df5d7
      - path: models/incremental/p04_new_soldier_best.pt
        sha256: c22face61219ebf6d7a887f57dd3b90030b7a50324789283e66a12532372ccee
    evidence:
      path: models/manifest.json
      sha256: 81b5b26248c9aabb7b3e934fa09d6f62273f222e4c83eb1406f49621e96fdd59
    runtime:
      x86_gpu: true
      ascend_310b: false

collaboration:
  - from: scene_sensor_net_v1
    to: unified_yolo11s_v1
    payload: agent_policy_context
    status: implemented
    proof_command: python -m fair_agent.cli decide --source IMAGE --class-focus soldier
    purpose: 认知结果进入 Agent 策略，用于选择检测配置和分组诊断；不改变 YOLO 输入张量
  - from: unified_yolo11s_v1
    to: incremental_model_bank_v1
    payload: weak_class_and_error_cases
    status: implemented
    purpose: 触发新类学习或弱类专项复核
  - from: incremental_model_bank_v1
    to: unified_yolo11s_v1
    payload: gated_incremental_predictions
    status: implemented
    proof_command: python -m pytest -q tests/test_web_inference.py tests/test_web_ui_flow.py
    purpose: Agent 自动评估通过 New-mAP/KRR 门禁的增量能力，并组合冻结旧类检测结果与全局类别映射后的增量结果；无需用户选择模型

schema_version: 1
generation_registry: models/generations.json

models:
  - id: scene_sensor_net_v1
    function: context_perception
    display_name: 场景与传感器认知模型
    implementation: multitask_cnn
    status: verified
    inputs: [image_rgb]
    outputs: [sensor_ir_sar, scene_air_forest_sea_urban, confidence]
    artifacts:
      - path: models/context/scene_sensor_net.pt
        sha256: aa99a0e58db1f80b0b6e0cc0e5049b6dc39e88f4349d2e7c362b1e2a25b83a7e
    evidence:
      path: models/context/scene_sensor_metrics.json
      sha256: 0c8695d2795b16c50988d652724da0c3685ed730e2d875954eb4e64199b965bb
      require_acceptance_passed: true
    runtime:
      x86_gpu: true
      ascend_310b: false

  - id: four_class_base_detector
    function: multimodal_target_detection
    display_name: 四类冻结基础检测器
    implementation: yolo26s
    status: verified
    inputs: [image_rgb]
    outputs: [base_class_boxes, class_ids, confidence]
    artifacts:
      - path: models/production/incremental_detection/four_class_base_detector.pt
        sha256: 105b6cb27f31559dc945bfb4bb508fb54ece6c5df40502b306a852b8ac4fa8dd
    evidence:
      path: models/manifest.json
      sha256: 7018d0835d7b54684d10e33fc8b4fbe98d53a32b93a9c3c086b824b0ebcbd932
    runtime:
      x86_gpu: true
      ascend_310b: false
      imgsz: 1280

  - id: incremental_model_bank_v1
    function: incremental_object_detection
    display_name: 二类增量目标检测模型库
    implementation: parallel_frozen_base_and_incremental_expert
    status: verified
    inputs: [incremental_images_labels, frozen_base_weights]
    outputs: [new_class_boxes, routing_trace, new_map50, krr, acceptance]
    artifacts:
      - path: models/production/incremental_detection/incremental_detector.pt
        sha256: 0ab0c6ed0117b75ab9ee105e9f109ccad96d988156d00fa4c4c0b9599e424a2a
    evidence:
      path: models/manifest.json
      sha256: 7018d0835d7b54684d10e33fc8b4fbe98d53a32b93a9c3c086b824b0ebcbd932
    runtime:
      x86_gpu: true
      ascend_310b: false
      imgsz: 1280

collaboration:
  - from: scene_sensor_net_v1
    to: four_class_base_detector
    payload: known_scene_probabilities
    status: implemented
    purpose: 已知场景概率与Base逐类训练先验计算亲和度，并软提升全局类0至3的有效阈值；不做场景硬路由
  - from: scene_sensor_net_v1
    to: incremental_model_bank_v1
    payload: known_scene_probabilities
    status: implemented
    purpose: 已知场景概率与Increment逐类训练先验计算亲和度，并软提升全局类4至5的有效阈值；专家仍对每张图执行
  - from: four_class_base_detector
    to: incremental_model_bank_v1
    payload: parallel_base_class_predictions
    status: implemented
    purpose: Base owner 与二类增量专家对每张未知图并行推理
  - from: incremental_model_bank_v1
    to: four_class_base_detector
    payload: fixed_class_owner_box_fusion
    status: implemented
    purpose: Base 固定负责全局类0至3，专家固定负责4和5，按dev逐类阈值直接合并

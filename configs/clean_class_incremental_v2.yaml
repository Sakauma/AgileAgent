schema_version: 1
seed: 20260713
model: yolo11s.pt

experiment:
  id: clean-ci-v2-warship
  run_id: clean-ci-v2-warship-r02
  purpose: 用舰船小样本批次模拟一次在线类别增量注入
  simulation_role: first_incremental_batch
  active_web_candidate: false

paths:
  source_splits:
    train: splits/train.txt
    val: splits/dev_val.txt
    lock: splits/lock_val.txt
  dataset_root: incremental_clean_v2
  run_root: runs/detect/clean_class_incremental_v2
  report_root: reports/clean_class_incremental_v2
  freeze_root: models/experiments/clean_class_incremental_v2_staging

runtime:
  preferred_devices: ["1"]
  parallel: false
  workers: 8
  env:
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"

common:
  imgsz: 640
  batch: 32
  optimizer: AdamW
  patience: 30
  cache: false
  plots: true
  amp: true
  weight_decay: 0.0

adaptation:
  mode: expanded_single_student
  student_init: yolo11s.pt
  trainable_parameters: new_classification_channel_only
  new_class_channel_init: deterministic_random_reset
  max_old_channel_drift: 0.000001
  update_budget:
    max_epochs: 30
    target_minutes: 15

base_train:
  epochs: 120
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  close_mosaic: 10

student_train:
  epochs: 30
  patience: 8
  lr0: 0.0008
  lrf: 0.01
  cos_lr: true
  close_mosaic: 10
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

predict:
  conf: 0.001
  iou: 0.70
  max_det: 300
  batch: 32
  evaluation_batch: 1
  rect: true

fusion:
  nms_iou: 0.60

calibration:
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_step: 0.01
  target_precision: 0.90

bootstrap:
  iterations: 1000
  seed: 20260713
  strata: [sensor, class_presence]

acceptance:
  min_new_map50: 0.60
  min_krr: 0.95
  min_calibration_precision: 0.90
  min_lock_precision: 0.70
  min_lock_recall: 0.75
  max_false_activation_rate: 0.15
  min_full_map50: 0.80
  max_evaluator_error: 0.005
  max_base_weight_drift: 0.0

reference:
  unified_four_class_map50: 0.91202
  reference_only: true

protocols:
  - id: warship-incremental
    display_name: 舰船 clean-room 3+1 类别增量
    base_classes: [soldier, small_aircraft, tank]
    new_class: warship
    new_global_id: 2
    base_local_to_global: {0: 0, 1: 1, 2: 3}
    build_unified_student: true
    expected_incremental_counts: {train: 126, val: 22, lock_positive: 21}
    preferred_device: "1"

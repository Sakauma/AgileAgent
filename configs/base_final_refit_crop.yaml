schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml

# 与最终通用 owner 使用同一 source train/val 边界；训练帧额外加入一个
# 320x256 最小目标裁剪，完整 160 epoch 后按稀疏 validation 选择 best.pt。
model: yolo11s.pt
epochs: 160
project_root: runs/detect/base_final_refit_crop
report_root: reports/base_final_refit_crop

evaluation:
  imgsz: 640
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

candidates:
  seed_a:
    seed: 20260705
    overrides: &small_object_overrides
      mosaic: 0.30
      close_mosaic: 30
  seed_b:
    seed: 20260706
    overrides: *small_object_overrides

schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml

# Pilot 候选必须从通用 COCO 预训练权重开始，不得继承已经看过全部
# 405 张 base_train 的权重，否则内部时序留出会发生泄漏。
model: yolo11m.pt
epochs: 160
project_root: runs/detect/base_small_object_sweep
report_root: reports/base_small_object_sweep

evaluation:
  imgsz: 896
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

# crop size 由每个候选的 --dataset 决定。这里只比较基准增强和更低的
# mosaic 强度；所有其他正式约束都从 strict config 继承。
candidates:
  temporal_baseline:
    seed: 20260705
    overrides: {}
  crop320_default:
    seed: 20260705
    overrides: {}
  crop320_low_mosaic:
    seed: 20260705
    overrides:
      mosaic: 0.30
      close_mosaic: 30
  crop384_default:
    seed: 20260705
    overrides: {}
  crop384_low_mosaic:
    seed: 20260705
    overrides:
      mosaic: 0.30
      close_mosaic: 30
  grid384_default:
    seed: 20260705
    overrides: {}
  grid384_low_mosaic:
    seed: 20260705
    overrides:
      mosaic: 0.30
      close_mosaic: 30
  recent_control:
    seed: 20260705
    overrides: {}
  recent_crop320_low_mosaic:
    seed: 20260705
    overrides:
      mosaic: 0.30
      close_mosaic: 30

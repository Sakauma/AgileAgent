schema_version: 1
seed: 20260705
# 唯一正式模板：基础 owner 与新增类专家都从通用 YOLO11s 预训练权重初始化。
model: models/pretrained/yolo11s.pt

paths:
  source_splits:
    train: splits/pool_train.txt
    val: splits/pool_dev.txt
    lock: splits/mixed_test.txt
  # 该清单只在全部 owner 对完整 mixed_test 完成无标签推理并冻结预测后读取。
  base_test_split: splits/strict_3plus1/base_test.txt
  dataset_root: incremental_strict_3plus1
  run_root: runs/detect/strict_3plus1
  report_root: reports/strict_3plus1
  freeze_root: models/profiles

runtime:
  preferred_devices: ["0"]
  parallel: false
  workers: 8
  env:
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"
    # 减少完整长训练中的 CUDA 保留段碎片。
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

training_policy:
  # 必须跑满各阶段规定的 epoch；达到计分门槛不能触发提前停止。
  require_full_epochs: true
  checkpoint_metric: map50

common:
  imgsz: 640
  batch: 32
  optimizer: AdamW
  # Ultralytics 中 patience=0 明确禁用 EarlyStopping。
  patience: 0
  cache: false
  plots: true
  amp: true
  deterministic: true
  weight_decay: 0.0005

base_train:
  epochs: 160
  imgsz: 896
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  close_mosaic: 20
  mosaic: 0.80
  mixup: 0.0
  copy_paste: 0.0
  multi_scale: 0.0
  degrees: 3.0
  translate: 0.15
  scale: 0.50
  fliplr: 0.50
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.30

incremental_train:
  epochs: 80
  imgsz: 640
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  close_mosaic: 10
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

adaptation:
  # 旧类由冻结基础检测器永久负责；增量专家只学习新类。
  mode: frozen_base_plus_new_specialist
  # 专家不继承已偏向旧类的检测头，仅从通用预训练表征快速学习新增类。
  specialist_init: generic_pretrained
  specialist_model: models/pretrained/yolo11s.pt

agent_structure:
  architecture: parallel_base_incremental_experts
  inference_scope: every_image
  old_class_owner: frozen_base
  new_class_owner: incremental_specialist
  fusion_level: detection_boxes
  scene_hard_routing: false
  label_aware_routing: false
  filename_class_routing: false

predict:
  # 与最终 Agent profile 共用，避免评测时低阈值、部署时高阈值的不一致。
  conf: 0.01
  iou: 0.70
  max_det: 300
  batch: 32
  evaluation_batch: 1
  rect: true
  # 只依据各自 dev 集冻结；基础小目标受益于更高分辨率，增量专家保持训练尺度。
  base_imgsz: 896
  incremental_imgsz: 640
  augment: false

fusion:
  nms_iou: 0.60
  cross_class:
    enabled: true
    iou: 0.50
    base_confidence: 0.50
    incremental_margin: 0.15
    preserve_base_class_owners: true

prototype_gate:
  # 原型拒识保留为可选风险诊断；当前计分主线不硬过滤候选框，避免损伤 mAP。
  enabled: false
  grid_size: 8
  minimum_scale: 0.10
  target_recall: 0.95
  safety_factor: 1.10
  iou_threshold: 0.50

calibration:
  # 只能用增量 dev 校准；禁止为了 lock mAP 使用 0.01 低阈值部署。
  deployment_policy: incremental_dev_calibrated
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_step: 0.01
  # 比 Agent 的0.90部署门槛保留5个百分点安全余量，同时避免过度牺牲召回率。
  target_precision: 0.95

context_gate:
  # 场景类别均为已知类。这里只把已知场景兼容性作为新增框阈值的软惩罚，
  # 不能据此跳过任一检测器，也不能把“未知场景”直接解释成新增目标。
  enabled: true
  model: models/context/scene_sensor_net.pt
  dimensions: [scene]
  max_threshold_penalty: 0.05
  batch_size: 32

deployment_acceptance:
  # 兼容旧报告字段；两项只生成诊断告警，不再阻断计分满分候选进入 Agent。
  min_new_class_precision: 0.90
  max_new_class_false_activation_rate: 0.05

bootstrap:
  iterations: 1000
  seed: 20260705
  strata: [sensor, class_presence]

acceptance:
  # 唯一三项赛题计分门槛。
  min_base_map50: 0.80
  min_new_map50: 0.60
  min_krr: 0.95

integrity:
  # 只用于证明评分实现和冻结约束可信，不增加第四个性能门槛。
  max_evaluator_error: 0.005
  max_base_weight_drift: 0.0

protocols:
  - id: warship-incremental
    display_name: 舰船严格 3+1
    base_classes: [soldier, small_aircraft, tank]
    new_class: warship
    new_global_id: 2
    base_local_to_global: {0: 0, 1: 1, 2: 3}
    build_unified_student: false
    # lock 类别数量只能在无标签预测冻结后由评分器获知。
    expected_incremental_counts: {train: 132, val: 18}
    expected_base_test_count: 70
    preferred_device: "0"

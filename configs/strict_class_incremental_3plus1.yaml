schema_version: 1
seed: 20260705
model: yolo11s.pt

paths:
  source_splits:
    train: splits/pool_train.txt
    val: splits/pool_dev.txt
    lock: splits/mixed_test.txt
  dataset_root: incremental_strict_3plus1
  run_root: runs/detect/strict_3plus1
  report_root: reports/strict_3plus1
  freeze_root: models/profiles

runtime:
  preferred_devices: ["0"]
  parallel: false
  workers: 8
  env:
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"

common:
  imgsz: 640
  batch: 32
  optimizer: AdamW
  patience: 30
  cache: false
  plots: true
  amp: true
  weight_decay: 0.0005

base_train:
  epochs: 160
  patience: 40
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  close_mosaic: 20
  mosaic: 0.80
  mixup: 0.0
  copy_paste: 0.0
  multi_scale: 0.25
  degrees: 3.0
  translate: 0.15
  scale: 0.50
  fliplr: 0.50
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.30

incremental_train:
  epochs: 80
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  close_mosaic: 10
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

adaptation:
  # 旧类由冻结基础检测器永久负责；增量专家只学习新类。
  mode: frozen_base_plus_new_specialist

agent_structure:
  architecture: parallel_base_incremental_experts
  inference_scope: every_image
  old_class_owner: frozen_base
  new_class_owner: incremental_specialist
  fusion_level: detection_boxes
  scene_hard_routing: false
  label_aware_routing: false
  filename_class_routing: false

predict:
  # 与最终 Agent profile 共用，避免评测时低阈值、部署时高阈值的不一致。
  conf: 0.01
  iou: 0.70
  max_det: 300
  batch: 32
  evaluation_batch: 1
  rect: true

fusion:
  nms_iou: 0.60
  cross_class:
    enabled: true
    iou: 0.50
    base_confidence: 0.50
    incremental_margin: 0.15
    preserve_base_class_owners: true

prototype_gate:
  # 原型拒识保留为可选风险诊断；当前计分主线不硬过滤候选框，避免损伤 mAP。
  enabled: false
  grid_size: 8
  minimum_scale: 0.10
  target_recall: 0.95
  safety_factor: 1.10
  iou_threshold: 0.50

calibration:
  deployment_threshold: 0.01
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_step: 0.01
  target_precision: 0.99

bootstrap:
  iterations: 1000
  seed: 20260705
  strata: [sensor, class_presence]

acceptance:
  # 官方三项计分：基础测试 mAP50、新增类别 New-mAP50、旧类知识保持率。
  min_base_map50: 0.80
  min_new_map50: 0.60
  min_krr: 0.95
  max_evaluator_error: 0.005
  max_base_weight_drift: 0.0

reference:
  # 历史旧划分上的上限参考，不参与当前划分的验收判定。
  unified_four_class_map50: 0.91202

protocols:
  - id: warship-incremental
    display_name: 舰船严格 3+1
    base_classes: [soldier, small_aircraft, tank]
    new_class: warship
    new_global_id: 2
    base_local_to_global: {0: 0, 1: 1, 2: 3}
    build_unified_student: false
    # lock 类别数量只能在无标签预测冻结后由评分器获知。
    expected_incremental_counts: {train: 117, val: 18}
    preferred_device: "0"

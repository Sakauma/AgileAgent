schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml
model: yolo11m.pt
epochs: 160
project_root: runs/detect/base_small_object_final
report_root: reports/base_small_object_final

evaluation:
  imgsz: 640
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

# 裁剪尺度与融合形式已在 base_train 内部时序留出上冻结。
# 最终候选只使用 405 张 base_train 训练，只使用 70 张 base_dev 选模。
candidates:
  crop384_low_seed_a:
    seed: 20260705
    overrides:
      mosaic: 0.30
      close_mosaic: 30
  crop384_low_seed_b:
    seed: 20260706
    overrides:
      mosaic: 0.30
      close_mosaic: 30
  crop384_default_seed_a:
    seed: 20260705
    overrides: {}

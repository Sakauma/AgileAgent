schema_version: 1
seed: 20260714
model: yolo11s.pt

experiment:
  id: duet-vs-yolo-iod-lite-warship
  run_id: ci-methods-warship-r01
  purpose: 在同一严格 p02 舰船批次上比较两种无旧样本快速类别增量方法
  active_web_candidate: false

paths:
  source_splits:
    train: splits/train.txt
    val: splits/dev_val.txt
    lock: splits/lock_val.txt
  shared_base_checkpoint: runs/detect/clean_class_incremental_v2/clean-ci-v2-warship-r02/strict-p02/base/weights/best.pt
  dataset_root: incremental_method_comparison
  run_root: runs/detect/incremental_method_comparison
  report_root: reports/incremental_method_comparison
  freeze_root: models/experiments/incremental_method_comparison_staging
  row_only_baseline_metrics: reports/clean_class_incremental_v2/clean-ci-v2-warship-r02/strict-p02/metrics.json

runtime:
  preferred_devices: ["1", "2"]
  parallel: true
  workers: 8
  env:
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"

common:
  imgsz: 640
  batch: 32
  optimizer: AdamW
  patience: 10
  cache: false
  plots: true
  amp: true
  weight_decay: 0.0005

adaptation:
  mode: method_comparison
  student_init: yolo11s.pt
  max_old_channel_drift: 0.000001
  update_budget:
    target_minutes_per_method: 30

methods:
  duet_yolo11s:
    implementation_level: yolo11s_adaptation
    paper_basis: ICCV-2025-DuET
    shared_key_exclude: [model.23]
    distill_quantile: 0.75
    minimum_teacher_confidence: 0.01
    loss_weights:
      old_bbox: 0.02
      old_feature: 0.01
      direction: 0.05
    task_arithmetic:
      alpha_old: 0.50
      alpha_new: 0.50
    current_task_train:
      epochs: 30
      lr0: 0.001
      lrf: 0.01
      cos_lr: true
      close_mosaic: 8
      mosaic: 1.0
      mixup: 0.0
      copy_paste: 0.0

  yolo_iod_lite:
    implementation_level: yolo11s_lightweight_adaptation
    paper_basis: AAAI-2026-YOLO-IOD
    kernel_selection_ratio: 0.25
    kernel_selection_exclude: [.cv3.]
    distill_quantile: 0.75
    minimum_teacher_confidence: 0.01
    loss_weights:
      old_class: 0.10
      old_bbox: 0.03
      old_feature: 0.01
      current_class: 0.25
      current_bbox: 0.05
      current_feature: 0.02
    cpr:
      enabled: false
      reason: strict_p02_has_no_old_class_cooccurrence
    current_teacher_train:
      epochs: 30
      lr0: 0.001
      lrf: 0.01
      cos_lr: true
      close_mosaic: 8
      mosaic: 1.0
      mixup: 0.0
      copy_paste: 0.0
    student_train:
      epochs: 30
      lr0: 0.0005
      lrf: 0.01
      cos_lr: true
      close_mosaic: 8
      mosaic: 1.0
      mixup: 0.0
      copy_paste: 0.0

base_train:
  epochs: 120
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  close_mosaic: 10

predict:
  conf: 0.001
  iou: 0.70
  max_det: 300
  batch: 32
  evaluation_batch: 1
  rect: true

fusion:
  nms_iou: 0.60

calibration:
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_step: 0.01
  target_precision: 0.90

bootstrap:
  iterations: 1000
  seed: 20260714
  strata: [sensor, class_presence]

acceptance:
  min_new_map50: 0.60
  min_krr: 0.95
  min_calibration_precision: 0.90
  min_lock_precision: 0.70
  min_lock_recall: 0.75
  max_false_activation_rate: 0.15
  min_full_map50: 0.80
  max_evaluator_error: 0.005
  max_base_weight_drift: 0.0

reference:
  unified_four_class_map50: 0.91202
  reference_only: true

protocols:
  - id: duet-p02
    display_name: DuET-YOLO11s 舰船类别增量
    adaptation_mode: duet_yolo11s
    base_classes: [soldier, small_aircraft, tank]
    new_class: warship
    new_global_id: 2
    base_local_to_global: {0: 0, 1: 1, 2: 3}
    build_unified_student: true
    expected_incremental_counts: {train: 126, val: 22, lock_positive: 21}
    preferred_device: "1"

  - id: yolo-iod-lite-p02
    display_name: YOLO-IOD-lite 舰船类别增量
    adaptation_mode: yolo_iod_lite
    base_classes: [soldier, small_aircraft, tank]
    new_class: warship
    new_global_id: 2
    base_local_to_global: {0: 0, 1: 1, 2: 3}
    build_unified_student: true
    expected_incremental_counts: {train: 126, val: 22, lock_positive: 21}
    preferred_device: "2"

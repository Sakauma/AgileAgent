schema_version: 2

experiment:
  id: official-yolo-iod-full-strict-p02-no-cpr-eb16
  run_id: yolo-iod-full-warship-r04
  protocol: strict-p02
  implementation_level: official_full_adapted
  official_commit: 3d9d05a6e88561c88916657367412f9adb7341a7
  active_web_candidate: false

official_patch:
  path: patches/yolo_iod_single_class_grad_mask.patch
  purpose: 修复 GPS 掩码缺失与重要性扫描后的梯度累积计数

paths:
  official_repo: /project/IDIP/MAJ/code/YOLO-IOD
  source_splits:
    train: splits/train.txt
    val: splits/dev_val.txt
    lock: splits/lock_val.txt
  report_root: reports/full_yolo_iod

runtime:
  python: /project/IDIP/CONDA_ENV/envs/yolo-iod-full/bin/python
  devices: ["1"]
  env:
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"
    MASTER_PORT: "29641"
    TOKENIZERS_PARALLELISM: "false"
    HF_ENDPOINT: https://hf-mirror.com

compatibility:
  albumentations: "1.3.1"
  numpy: "1.26.4"

classes:
  old: [soldier, small aircraft, tank]
  new: warship
  official_order: [soldier, small aircraft, tank, warship]
  global_to_official: {0: 0, 1: 1, 3: 2, 2: 3}

dataset:
  format: coco
  expected_counts:
    source_train: 560
    source_dev: 95
    base_train: 434
    base_dev: 73
    current_train: 126
    current_dev: 22
    lock: 95
  base_excludes_new_class_images: true
  incremental_contains_only_new_class_images: true
  incremental_validation_only: true
  lock_materialize_after_freeze: true

pretrained:
  path: weights/x_stage1-62b674ad.pth
  urls:
    - https://hf-mirror.com/wondervictor/YOLO-World-V2.1/resolve/main/x_stage1-62b674ad.pth
    - https://huggingface.co/wondervictor/YOLO-World-V2.1/resolve/main/x_stage1-62b674ad.pth
  sha256: ""

training:
  target_effective_batch_size: 16
  base:
    epochs: 20
    batch_per_gpu: 4
    gradient_accumulation_steps: 4
  current_teacher:
    epochs: 20
    batch_per_gpu: 4
    gradient_accumulation_steps: 4
  final:
    epochs: 20
    batch_per_gpu: 2
    gradient_accumulation_steps: 8
    devices: ["1"]
  amp: true
  gps_ratio: 0.8
  up_ratio: 0.8
  optimizer: AdamW
  lr: 0.0002
  weight_decay: 0.05

cpr:
  enabled: false
  mode: disabled_no_old_class_cooccurrence
  required_incremental_old_class_gt_count: 0

cakd:
  enabled: true
  old_class_temperature: 1000
  old_regression_temperature: 2
  new_class_temperature: 800
  new_regression_temperature: 1

evaluation:
  device: "1"
  metric: mAP50
  old_classes: [soldier, small aircraft, tank]
  new_class: warship
  min_new_map50: 0.60
  min_krr: 0.95
  min_full_map50: 0.80
  compare_with:
    full_r03: reports/full_yolo_iod/yolo-iod-full-warship-r03/run_summary.json
    lite: reports/incremental_method_comparison/ci-methods-warship-r01/yolo-iod-lite-p02/metrics.json
    row_only: reports/clean_class_incremental_v2/clean-ci-v2-warship-r02/strict-p02/metrics.json

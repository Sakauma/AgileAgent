schema_version: 1
kind: ascend310b_full_score_method

target:
  soc_version: Ascend310B1
  cann_version: 7.0.RC1
  precision: mixed_float16
  candidate_port: 8502
  formal_port: 8501

competition:
  accuracy_gates:
    base_map50_min: 0.80
    new_map50_min: 0.60
    krr_min: 0.95
  performance_gate:
    batch_image_count: 20
    batch_rounds: 3
    median_fps_min: 30.0
  diagnostics_only:
    - per_box_equivalence
    - business_json_equivalence
    - lock_precision
    - false_activation_rate
    - single_request_mean_ms
    - single_request_p95_ms
    - single_request_p99_ms
    - scene_sensor_accuracy
  validity_prerequisites:
    predictions_frozen_before_labels: true
    old_raw_image_count: 0
    old_raw_label_count: 0
    old_feature_cache_count: 0
    original_data_modified: false
    shared_max_drift: 0.0
    verify_asset_sha256: true

training:
  method: phase_separated_independent_yolo26s
  checkpoint_metric: map50
  reference_export_checkpoint: best
  base_data_scope: base_train_dev_only
  incremental_data_scope: incremental_train_dev_only
  base_components_frozen:
    - backbone
    - neck
    - old_head
    - batch_norm_statistics
    - base_ema
  incremental_data_only: true
  input_size: [608, 736]
  epochs: 500
  patience: 50
  seed: 3407
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  deterministic: true
  cache: false
  plots: true
  amp: true
  cos_lr: true
  warmup_epochs: 0.0
  warmup_bias_lr: 0.0
  close_mosaic: 10
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  multi_scale: 0.0
  degrees: 3.0
  translate: 0.15
  scale: 0.50
  fliplr: 0.50
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.30

export:
  model_layout: independent_yolo26_e2e_v1
  output_contract: yolo26_e2e_v1
  input_name: images
  input_shape_nchw: [1, 3, 608, 736]
  input_shape_aipp_nhwc: [1, 608, 736, 3]
  opset: 17
  max_det: 300
  models:
    base:
      owner: frozen_base_model
      source: models/production/incremental_detection/four_class_base_detector.pt
      class_map: {"0": 0, "1": 1, "2": 2, "3": 3}
      class_count: 4
      aipp_config: configs/ascend310b/aipp/base_detector.cfg
      output_shape: [1, 300, 6]
    specialist:
      owner: incremental_model
      source: models/production/incremental_detection/incremental_detector.pt
      class_map: {"0": 4, "1": 5}
      class_count: 2
      aipp_config: configs/ascend310b/aipp/incremental_detector.cfg
      output_shape: [1, 300, 6]

runtime:
  encoded_preprocessing: dvpp
  memory_mode: pageable
  schedule_mode: unified_enqueue
  execution_mode: async_stream
  context_mode: model
  neutral_context_score: 0.5
  content_execution_gate:
    enabled: true
    policy: skip_specialist_on_scene_and_base_evidence_v1
    action: skip_specialist
    scene: air
    scene_probability_min: 0.5
    base_evidence_class_ids: [1]
    base_evidence_mode: any
    online_inputs: [scene_probabilities, base_detections]
    label_aware_online_routing: false
    filename_aware_online_routing: false
    learning_data_scope: frozen_system_calibration
  detailed_event_timing: false
  fast_bounded_multipart: true
  neutral_scheduling_elision: true
  image_copy_elision: true

threshold_search:
  selection_scope: mixed_dev_only
  lock_split_opened_during_selection: false
  scoring_request_confidence: 0.01
  objective: minimize_new_class_false_activation_subject_to_accuracy_gates
  evaluated_candidate_count: 5476
  passing_candidate_count: 4467
  selected_per_class_thresholds:
    "0": 0.075
    "1": 0.05
    "2": 0.05
    "3": 0.05
    "4": 0.20
    "5": 0.50
  score_calibration:
    method: logit_affine
    frozen_base_model: {temperature: 1.5, bias: 0.0}
    incremental_model: {temperature: 1.0, bias: -0.5}
  known_scene_soft_penalties: {"4": 0.05, "5": 0.0}
  conflict_iou: 0.50
  specialist_margin: 0.15
  cross_class_iou: 0.90
  smaller_box_coverage: 0.95
  incremental_over_base_margin: 0.0
  selection_order:
    - all_accuracy_gates_pass
    - lowest_new_class_false_activation
    - highest_new_map50
    - highest_full_map50
  first_lock_failure_used_for_reselection: false

benchmark:
  base_url: http://127.0.0.1:8502
  official_url: http://127.0.0.1:8501
  warmup_requests: 30
  batch_probe_size: 20
  batch_rounds: 3
  target_batch_fps: 30.0
  encoded: true
  run_web_pytest_on_board: false
  image_contract:
    root_glob: "*.png"
    width: 640
    height: 512
    bit_depth: 8
    color_types: [0, 2, 6]

reference_result:
  date: "2026-08-24"
  validation_stage: ascend310b_runtime_calibration_public_8501_post_promotion
  old_candidate_confidence: 0.10
  new_candidate_confidence: 0.01
  base_map50: 0.8166630281570453
  new_map50: 0.6114608956156757
  full_map50: 0.7220053258250602
  krr: 1.0
  old_map50_before: 0.7772775409297523
  old_map50_after: 0.7772775409297523
  old_prediction_equivalent: true
  lock_precision: 0.7291666666666666
  lock_recall: 0.6126984126984127
  false_activation_rate: 0.22666666666666666
  false_activation_image_count: 17
  false_activation_negative_image_count: 75
  candidate_batch_median_fps: [38.38771593090211, 39.13894324853229]
  public_8501_batch_rounds:
    - [38.58024691358025, 38.669760247486465, 38.66228494104002]
  public_8501_batch_median_fps: [38.66228494104002]
  board_accuracy_passed: true
  board_batch_fps_passed: true

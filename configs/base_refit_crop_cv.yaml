schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml

# 小目标 owner 使用与通用 owner 完全相同的五折非测试边界；每张训练原图
# 额外生成一个 320x256 最小目标裁剪，验证集始终只含完整帧。
model: yolo11s.pt
epochs: 160
project_root: runs/detect/base_refit_crop_cv
report_root: reports/base_refit_crop_cv

evaluation:
  imgsz: 640
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8


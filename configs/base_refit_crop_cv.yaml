  fold_0:
    seed: 20260705
    overrides: &small_object_overrides
      mosaic: 0.30
      close_mosaic: 30
  fold_1:
    seed: 20260705
    overrides: *small_object_overrides
  fold_2:
    seed: 20260705
    overrides: *small_object_overrides
  fold_3:
    seed: 20260705
    overrides: *small_object_overrides
  fold_4:
    seed: 20260705
    overrides: *small_object_overrides

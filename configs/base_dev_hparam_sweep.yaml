schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml
model: yolo11m.pt

# 只在三类基础 train/dev 上比较；每个候选都必须完整跑满同一预算。
epochs: 160
project_root: runs/detect/base_dev_sweep
report_root: reports/base_dev_sweep

evaluation:
  imgsz: 896
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

# 基线本身已有完整结果，不重复运行；这里只比较保守的单变量或小范围改动。
candidates:
  seed_repeat:
    seed: 20260706
    overrides: {}
  stronger_decay:
    seed: 20260705
    overrides:
      weight_decay: 0.001
  lower_peak_lr:
    seed: 20260705
    overrides:
      lr0: 0.00075
  mild_geometry:
    seed: 20260705
    overrides:
      mosaic: 0.60
      translate: 0.10
      scale: 0.40


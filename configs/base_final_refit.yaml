schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml

# 五折 OOF 固定方案后，用约 90% 的全部非测试旧类帧训练最终通用 owner。
# 稀疏 validation 只用于 160 epoch 内选择 best.pt，不作为独立性能证据。
model: yolo11m.pt
epochs: 160
project_root: runs/detect/base_final_refit
report_root: reports/base_final_refit

evaluation:
  imgsz: 896
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

candidates:
  seed_a:
    seed: 20260705
    overrides: {}
  seed_b:
    seed: 20260706
    overrides: {}

schema_version: 1
candidate_id: base-s896-classwise-oof-20260807-v4
selection_scope: base_train_dev_oof_policy_and_refit_weights
lock_data_access_during_selection: false

paths:
  # 该 89 张锁集已经完成过首次独立评测；再次运行只能作为本地回归，
  # 不能重新声明为独立测试证据。
  lock_split: splits/mixed_test.txt
  report_root: reports/base_ensemble_regression
  selection_report: reports/base_final_refit_selection/s896-classwise-oof-v4.json
  oof_candidate_selection_report: reports/base_refit_oof/final-policy-selection-s896-20260807-v2.json
  oof_policy_report: reports/base_refit_oof/fusion-s896-tune-validate-20260807-v1.json
  class_owner_selection_report: reports/base_refit_oof/class-owner-selection-s896-20260807-v2.json
  checkpoint_holdout_manifest: runs/detect/base_final_refit_data/manifest.json
  checkpoint_holdout_report: reports/base_final_refit_agent/s896-classwise-oof-v4/report.json
  training_reports:
    s896_b_896: reports/base_final_refit_s896/final-refit-s896-20260807-v1/seed_b.json
    generic_b_1024: reports/base_final_refit/final-refit-20260807-v1/seed_b.json
    crop_a_full_640: reports/base_final_refit_crop/final-refit-crop-20260807-v1/seed_a.json

models:
  s896_b_896:
    weights: runs/detect/base_final_refit_s896/final-refit-s896-20260807-v1/seed_b/weights/best.pt
    imgsz: 896
    inference_mode: full_frame
  generic_b_1024:
    weights: runs/detect/base_final_refit/final-refit-20260807-v1/seed_b/weights/best.pt
    imgsz: 1024
    inference_mode: full_frame
  crop_a_full_640:
    weights: runs/detect/base_final_refit_crop/final-refit-crop-20260807-v1/seed_a/weights/best.pt
    imgsz: 640
    inference_mode: full_frame
  incremental_specialist:
    weights: runs/detect/strict_3plus1/strict-yolo11m-generic-20260806-215608/warship-incremental/specialist/weights/best.pt
    imgsz: 640

# OOF 报告中的 owner 名称到最终 refit owner 的唯一映射。
oof_owner_mapping:
  generic: s896_b_896
  crop_full: crop_a_full_640
  generic1024: generic_b_1024

# 非 focus 类也只依据 OOF 调参折逐类选择 owner，再在后置折验证。
class_owner_mapping:
  s896: s896_b_896

# 基础 owner 的本地三类顺序为 soldier / small_aircraft / tank；
# Agent 的全局四类顺序为 soldier / small_aircraft / warship / tank。
base_local_to_global: {0: 0, 1: 1, 2: 3}
incremental_local_to_global: {0: 2}
old_class_ids: [0, 1, 3]
new_class_id: 2

predict:
  conf: 0.01
  iou: 0.70
  max_det: 300
  batch: 32
  evaluation_batch: 1
  rect: true
  augment: false

base_fusion:
  # 三个基础推理 pass 都对每张未知图片执行。融合只依据预测框及预测类别，
  # 不读取图片文件名、场景、测试标签，也不先判断图片属于新类还是旧类。
  class_policies:
    0:
      primary: s896_b_896
      secondary_scales:
        crop_a_full_640: 1.00
        generic_b_1024: 1.00
      scale_before_clustering: false
      iou: 0.45
      agreement_bonus: 0.15
      weighted_boxes: true
    1:
      primary: s896_b_896
      secondary_scales: {}
      scale_before_clustering: false
      iou: 0.45
      agreement_bonus: 0.0
      weighted_boxes: false
    3:
      primary: s896_b_896
      secondary_scales: {}
      scale_before_clustering: false
      iou: 0.45
      agreement_bonus: 0.0
      weighted_boxes: false

incremental_fusion:
  nms_iou: 0.60
  # 旧类 owner 与新增类 owner 对同一张未知图共同推理。关闭跨类别压制，
  # 保证冻结的旧类预测不会因新增 owner 的输出而被删除。
  cross_class:
    enabled: false
    iou: 0.50
    base_confidence: 0.50
    incremental_margin: 0.15
    preserve_base_class_owners: true

selection_requirements:
  required_epochs: 160
  required_batch: 32
  required_patience: 0
  max_degraded_tuning_folds: 0
  min_oof_map50: 0.85
  min_validation_fold_map50: 0.85

evaluation_protocol:
  evidence_kind: local_regression_reuse_not_independent
  independent_test_evidence: false
  labels_may_only_be_read_after_prediction_freeze: true

acceptance:
  # 0.80 是赛题满分线；0.85 是内部工程安全目标。
  min_base_test_map50: 0.85
  min_new_map50: 0.60
  min_krr: 0.95

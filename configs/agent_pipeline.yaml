schema_version: 2
seed: 20260705

runtime:
  mode: local
  local_python: null
  default_device: "0"
  server_host: 127.0.0.1
  server_port: 8501

web:
  generation_registry: models/generations.json
  generation_channel: production
  detector_weights: models/base/yolo11s_ir_sar_imgsz640.pt
  functional_registry: configs/functional_models.yaml
  model_manifest: models/manifest.json

inference:
  backend: tensorrt_engine
  imgsz: 640
  specialist_imgsz: 512
  iou: 0.70
  max_det: 300
  batch_size: 1
  confidence_min: 0.01
  confidence_max: 1.00
  confidence_default: 0.50
  warmup_iterations: 1
  warmup_batch_size: 1
  warmup_width: 640
  warmup_height: 512
  preload_specialists: true
  quantize: null
  cudnn_benchmark: true
  compile: false

routing:
  incremental_enabled: true
  require_acceptance_passed: true
  consensus_iou: 0.30
  fusion_iou: 0.60
  max_specialists_per_image: 4
  conflict_iou: 0.50
  conflict_base_confidence: 0.50
  specialist_margin: 0.15
  detection_evidence_weight: 0.70
  context_evidence_weight: 0.30
  neutral_context_score: 0.50
  default_routing_prior: 0.50
  parallel_model_execution: true
  parallel_context_execution: true
  parallel_context_batch_execution: true
  max_model_workers: 6

limits:
  max_file_bytes: 20971520
  max_batch_files: 20
  max_batch_bytes: 209715200
  max_image_pixels: 25000000
  allowed_image_formats: [PNG, JPEG, BMP, TIFF]
  decode_backend: opencv
  decode_workers: 4

storage:
  max_items: 4
  ttl_seconds: 1800
  max_bytes: 536870912

logging:
  root: reports/agent_logs
  max_file_bytes: 10485760
  retained_files: 14
  request_bodies: false

incremental_workbench:
  root: data/incremental_batches
  max_archive_bytes: 2147483648
  max_extracted_bytes: 5368709120
  max_extracted_files: 20000
  max_image_pixels: 25000000
  allowed_image_extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]
  require_labels: true
  validation_fraction: 0.20
  minimum_images: 2
  preview_limit: 12
  job_log_tail_lines: 300
  poll_interval_ms: 2000
  training:
    python: null
    initial_weights: models/experiments/strict_3plus1/strict-p02/strict-20260712-102534/base.pt
    device: "0"
    imgsz: 640
    batch: 32
    epochs: 80
    patience: 20
    workers: 8
    optimizer: AdamW
    lr0: 0.001
    seed: 20260705
    deterministic: true
    amp: true

ui:
  history_limit: 20
  result_cache_limit: 10
  health_poll_ms: 15000
  toast_duration_ms: 4200
  default_view: detect

performance:
  target_api_fps: 30
  target_p95_ms: 50
  auto_start_server: true
  server_start_timeout_seconds: 180
  request_timeout_seconds: 180
  benchmark_rounds: 3
  warmup_requests: 3
  benchmark_split: splits/lock_val.txt
  report_root: reports/api_performance
  concurrent_requests: 8
  batch_probe_size: 20

generation:
  registry: models/generations.json
  recheck_lock_split: splits/lock_val.txt
  report_root: reports/generation_rechecks
  candidate_id: generation-1-recheck-v2
  calibrated_threshold: 0.63
  acceptance:
    min_base_map50: 0.80
    min_new_map50: 0.60
    min_krr: 0.95
    min_combined_map50: 0.80
    min_lock_precision: 0.70
    max_false_activation_rate: 0.15

native_backend:
  library: build/native/libagile_agent_tensorrt.so
  base_engine: models/engines/strict_p02_base_v1_fp16.engine
  context_engine: models/engines/scene_sensor_net_v1_fp16.engine
  precision: fp16
  require_exact_gpu: true
  validated: false

tensorrt_backend:
  expected_version: 10.8.0.43
  expected_compute_capability: "8.9"
  require_exact_gpu: true
  validated: true
  precision: fp16
  workspace_gib: 4
  dynamic: false
  export:
    device: "0"
    overwrite: false
    onnx_opset: 17
    simplify: true
    context_checkpoint: models/context/scene_sensor_net.pt
    context_min_batch: 1
    context_opt_batch: 8
  context_engine:
    path: models/engines/rtx4060_trt10_8/scene_sensor_net_fp16_dynamic_b1_20_160.engine
    sha256: 1cec699d884eb31e7ba81a1b1e515b5b1f33b33cd4ea19640975f832481c7be6
    imgsz: 160
    batch_size: 20
  engines:
    models/experiments/strict_3plus1/strict-p02/strict-20260712-102534/base.pt:
      path: models/engines/rtx4060_trt10_8/strict_p02_base_fp16_b1_640.engine
      sha256: 95ce788ed8be933c7d06b8d77bfe1382b26d68fdd6668478c070543cee494d04
      imgsz: 640
      batch_size: 1
    models/experiments/strict_3plus1/strict-p02/strict-20260712-102534/specialist.pt:
      path: models/engines/rtx4060_trt10_8/strict_p02_warship_fp16_b1_512.engine
      sha256: 5927599daa96068efa6b2dcc70946818aae7cb5a2f901fc13aaebad838ed665d
      imgsz: 512
      batch_size: 1

model:
  weights: models/base/yolo11s_ir_sar_imgsz640.pt
  expected_sha256: 387d885a07797dea4a65900bc6f80ab380f1926eef622904331a151470b6f31c

assets:
  manifest: models/manifest.json
  generation_registry: models/generations.json
  checksums: models/SHA256SUMS.txt
  required:
    - models/base/yolo11s_ir_sar_imgsz640.pt
    - models/incremental/p01_new_small_aircraft_best.pt
    - models/incremental/p02_new_warship_best.pt
    - models/incremental/p03_new_tank_best.pt
    - models/incremental/p04_new_soldier_best.pt
    - models/context/scene_sensor_net.pt
    - models/context/scene_sensor_metrics.json
    - models/manifest.json
    - models/generations.json
    - demo_artifacts/agent_demo_state.json

automation:
  audit_before_execute: true
  run_root: reports/agent_runs
  forbid_overwrite_fixed_reports: true
  allowed_risk_levels: [low]
  allowed_actions: [refresh_blackboard, diagnose_sar_soldier, review_incremental_learning]
  max_steps_per_run: 8
  default_timeout_seconds: 300
  allowed_output_roots: [reports/agent_runs, reports/agent_blackboard, reports/incremental_no_old_distill, runs/submission]

submission:
  official_test_ready: false
  official_format_confirmed: false
  official_format: null
  official_test_dir: datasets_r1_base_test

blackboard:
  output_dir: reports/agent_blackboard
  state_json: blackboard_state.json
  report_md: agent_preparation_report.md
  demo_evidence: demo_artifacts/agent_demo_state.json

detector:
  name: yolo11s_imgsz640
  weights: models/base/yolo11s_ir_sar_imgsz640.pt
  config: configs/submission_infer_yolo11s_imgsz640.yaml
  candidate_status: gpu_smoke_verified
  metric: mAP50
  lock_all_map50: 0.91202
  lock_sar_map50: 0.88158
  lock_sar_soldier_map50: 0.72962

functional_models:
  registry: configs/functional_models.yaml
  required_count: 3

inputs:
  data_audit: reports/data_audit_summary.json
  metadata: reports/metadata.csv
  final_candidate_card: reports/final_candidate_card.md
  sar_soldier_summary: reports/sar_soldier_error_v2_summary.md
  sar_soldier_case_bank: reports/agent_blackboard/sar_soldier_case_bank.csv
  agent_sar_soldier_casebank_split: splits/agent_sar_soldier_casebank_train.txt
  agent_sar_soldier_casebank_config: configs/agent_sar_soldier_casebank_yolo11s.yaml
  agent_sar_soldier_casebank_summary: reports/agent_sar_soldier_casebank_summary.md
  incremental_replay_report: reports/incremental_learning/replay_incremental_report.md
  incremental_p01_p04_summary: reports/incremental_learning_p01_p04_summary.md
  incremental_metrics:
    - reports/incremental_learning/replay_incremental_report.csv
    - reports/incremental_learning_p03_p04/yolo11s_incremental_summary.csv
  incremental_compliant_metrics: reports/incremental_no_old_distill/summary.csv
  specialist_metrics: reports/agent_sar_soldier_casebank/sar_soldier_replay_metrics.csv
  submission_smoke_manifest: runs/submission/smoke_yolo11s_imgsz640_lock_sar_20260710/manifest.json
  submission_dryrun_manifest: runs/submission/dryrun_yolo11s_imgsz640_lock_val_20260710/manifest.json

modules:
  - name: data_gate
    status: ready
    owner: data
    inputs: [reports/data_audit_summary.json, reports/metadata.csv]
    outputs: [reports/data_audit_report.md, reports/metadata.csv]
  - name: detector
    status: frozen_candidate
    owner: model
    inputs: [configs/submission_infer_yolo11s_imgsz640.yaml]
    outputs: [runs/submission/dryrun_yolo11s_imgsz640_lock_val_20260710]
  - name: error_analyzer
    status: ready
    owner: model
    inputs: [reports/sar_soldier_error_v2_summary.md]
    outputs: [reports/error_analysis_sar_soldier_v2]
  - name: incremental_manager
    status: ready_for_protocol_extension
    owner: incremental
    inputs: [configs/incremental_yolo11s.yaml, incremental_protocols]
    outputs: [reports/incremental_learning]
  - name: report_writer
    status: ready
    owner: documentation
    inputs: [reports]
    outputs: [reports/agent_blackboard]

policies:
  primary_model: use_unified_yolo11s_imgsz640
  submission_format: pending_official_confirmation
  sar_soldier_focus: tiny_object_localization_and_confidence
  incremental_learning: mode_aware_incremental_data_only
  end_device: paused_until_ascend_board_ready

thresholds:
  min_new_class_map50: 0.60
  min_krr: 0.95
  preferred_export_conf: null
  fallback_export_conf: 0.01
  weak_class_map50: 0.80

incremental:
  task_type: incremental_object_detection
  primary_mode: class_incremental
  supported_modes: [class_incremental, target_incremental]
  learning_data_scope: incremental_dataset_only
  policy: configs/incremental_detection_policy.yaml
  expected_protocols: [p01_new_small_aircraft, p02_new_warship, p03_new_tank, p04_new_soldier]
  require_compliant_no_old_data: true

specialist_acceptance:
  min_lock_all_delta: 0.0
  min_lock_ir_soldier_delta: -0.01
  min_lock_sar_soldier_delta: 0.01

decision:
  default_context:
    sensor: sar
    scene: all
    class_focus: soldier
    official_test_ready: false
    official_format_confirmed: false
  outputs:
    decision_json: reports/agent_blackboard/agent_decision.json
    decision_md: reports/agent_blackboard/agent_decision_report.md
  actions:
    formal_submission:
      module: detector
      argv: ["{python}", tools/42_predict_submission.py, --config, configs/submission_infer_yolo11s_imgsz640.yaml]
      risk_level: high
      timeout_seconds: 0
      inputs: [models/base/yolo11s_ir_sar_imgsz640.pt, configs/submission_infer_yolo11s_imgsz640.yaml]
      outputs: [runs/submission]
    diagnose_sar_soldier:
      module: error_analyzer
      argv: ["{python}", tools/52_build_sar_soldier_case_bank.py]
      risk_level: low
      timeout_seconds: 300
      inputs: [reports/error_analysis_sar_soldier_v2/image_error_cases.csv]
      outputs: [reports/agent_blackboard/sar_soldier_case_bank.csv]
    review_incremental_learning:
      module: incremental_manager
      handler: review_incremental_learning
      risk_level: low
      timeout_seconds: 60
      inputs:
        - reports/incremental_no_old_distill/summary.csv
      outputs: [reports/incremental_no_old_distill/summary.md]
    refresh_blackboard:
      module: report_writer
      handler: refresh_blackboard
      risk_level: low
      timeout_seconds: 60
      inputs: [configs/agent_pipeline.yaml]
      outputs: [reports/agent_blackboard/blackboard_state.json]

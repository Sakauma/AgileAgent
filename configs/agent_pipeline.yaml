schema_version: 2
seed: 20260705

runtime:
  mode: local
  local_python: null
  default_device: "0"
  server_host: 127.0.0.1
  server_port: 8501

web:
  generation_registry: models/generations.json
  generation_channel: production
  detector_weights: models/base/yolo11s_ir_sar_imgsz640.pt
  functional_registry: configs/functional_models.yaml
  model_manifest: models/manifest.json

inference:
  backend: ultralytics_cuda
  imgsz: 640
  specialist_imgsz: 512
  iou: 0.70
  max_det: 300
  batch_size: 20
  confidence_min: 0.01
  confidence_max: 1.00
  confidence_default: 0.50
  warmup_iterations: 1
  warmup_batch_size: 1
  warmup_width: 640
  warmup_height: 512
  preload_specialists: true
  quantize: null
  cudnn_benchmark: true
  compile: false

routing:
  incremental_enabled: true
  require_acceptance_passed: true
  consensus_iou: 0.30
  fusion_iou: 0.60
  max_specialists_per_image: 4
  conflict_iou: 0.50
  conflict_base_confidence: 0.50
  specialist_margin: 0.15
  preserve_base_class_owners: true
  detection_evidence_weight: 0.70
  context_evidence_weight: 0.30
  neutral_context_score: 0.50
  default_routing_prior: 0.50
  parallel_model_execution: true
  parallel_context_execution: true
  parallel_context_batch_execution: true
  max_model_workers: 6

decoding:
  backend: opencv
  workers: 4

storage:
  max_items: 4
  ttl_seconds: 1800
  max_bytes: 536870912

logging:
  root: reports/agent_logs
  max_file_bytes: 10485760
  retained_files: 14
  request_bodies: false

incremental_workbench:
  root: data/incremental_batches
  max_archive_bytes: 2147483648
  max_extracted_bytes: 5368709120
  max_extracted_files: 20000
  max_image_pixels: 25000000
  allowed_image_extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]
  allowed_label_formats: [class_id_bbox, bbox_only]
  require_labels: true
  validation_fraction: 0.20
  lock_fraction: 0.20
  split_seed: 20260705
  minimum_images: 2
  preview_limit: 12
  job_log_tail_lines: 300
  poll_interval_ms: 2000
  lineage:
    required: true
    root: data/incremental_lineage
    base_manifest: data/incremental_lineage/base_dataset.json
    base_experiment_config: configs/incremental/warship_3plus1.yaml
    auto_initialize_base: true
    cache_roots: []
  lifecycle:
    auto_continue: true
    calibration_target_precision: 0.99
    threshold_min: 0.01
    threshold_max: 0.99
    threshold_step: 0.01
  training:
    python: null
    initial_weights: models/production/incremental_detection/three_class_base_detector.pt
    device: "0"
    imgsz: 640
    batch: 32
    epochs: 80
    patience: 20
    workers: 8
    optimizer: AdamW
    lr0: 0.001
    seed: 20260705
    deterministic: true
    amp: true

ui:
  history_limit: 20
  result_cache_limit: 10
  health_poll_ms: 15000
  toast_duration_ms: 4200
  default_view: detect

performance:
  target_api_fps: 30
  target_p95_ms: 50
  auto_start_server: true
  server_start_timeout_seconds: 180
  request_timeout_seconds: 180
  benchmark_rounds: 3
  warmup_requests: 3
  benchmark_split: splits/lock_val.txt
  report_root: reports/api_performance
  concurrent_requests: 8
  batch_probe_size: 20

generation:
  registry: models/generations.json
  runtime_registry: data/generation_registry/runtime.json
  recheck_lock_split: splits/lock_val_base_3plus1.txt
  report_root: reports/generation_rechecks
  candidate_id: incremental_detection_generation
  calibrated_threshold: 0.63
  auto_promote: true
  shadow_smoke_images: 1

gates:
  official_hard:
    base_map50_min: 0.80
    new_map50_min: 0.60
    krr_min: 0.95
    old_data_overlap_max: 0
  advisory:
    cumulative_map50_min: 0.80
    lock_precision_min: 0.70
    false_activation_rate_max: 0.15
    latency_proxy_ms_max: 33.3

incremental_guardian:
  enabled: true
  dynamic_confusion:
    enabled: true
    match_iou: 0.50
    min_support: 1
    specialist_deficit_padding: 0.02
    specialist_deficit_cap: 0.25
  recovery_actions:
    DATA_COMPLIANCE_FAILED: [block_training, rebuild_lineage_audit]
    OLD_DATA_LEAKAGE: [block_training, isolate_incremental_view]
    BASE_FULL_SCORE_NOT_REACHED: [keep_parent_generation, review_base_evidence]
    NEW_KNOWLEDGE_UNDERFIT: [audit_sample_quality, rebalance_incremental_classes, retry_training_on_dev]
    KNOWLEDGE_RETENTION_REGRESSION: [restore_class_owners, enable_teacher_consistency, rebuild_fusion_policy]
    CROSS_CLASS_CONFLICT_RISK: [learn_confusion_graph, replay_dev_fusion, shadow_compare]
    LOW_DEPLOYMENT_PRECISION: [recalibrate_per_class_thresholds]
    FALSE_ACTIVATION_RISK: [recalibrate_per_class_thresholds, strengthen_conflict_arbitration]
    LATENCY_OPTIMIZATION_REQUIRED: [reduce_specialist_budget, enable_batch_inference, evaluate_quantization]

native_backend:
  library: build/native/libagile_agent_tensorrt.so
  base_engine: runs/engines/local/three_class_base_detector.engine
  context_engine: runs/engines/local/scene_sensor_net.engine
  engines:
    models/production/incremental_detection/three_class_base_detector.pt:
      path: runs/engines/local/three_class_base_detector.engine
      sha256: null
    models/production/incremental_detection/incremental_detector.pt:
      path: runs/engines/local/incremental_detector.engine
      sha256: null
  precision: fp16
  require_exact_gpu: true
  validated: false

tensorrt_backend:
  expected_version: null
  expected_compute_capability: null
  require_exact_gpu: true
  validated: false
  validation_report: null
  precision: fp16
  workspace_gib: 4
  dynamic: true
  minimum_spatial_size: 32
  mixed_precision:
    enabled: false
    constraint: obey
    fp16_layer_patterns:
      - "/model.[2-9]/*"
      - "/model.1[0-9]/*"
      - "/model.2[0-3]/*"
    minimum_matched_layers: 269
  validation:
    max_overall_map50_delta_warning: 0.005
    max_per_class_map50_delta_warning: 0.01
    evaluation_batch_size: 8
  int8_calibration:
    enabled: true
    auto_quantize_incremental: true
    representative_split: splits/train.txt
    threshold_split: splits/dev_val.txt
    cache_root: runs/tensorrt_calibration
    batch_size: 8
    max_images: 256
    minimum_images_per_class: 8
    seed: 20260705
  export:
    device: "0"
    overwrite: false
    onnx_opset: 17
    simplify: true
    context_checkpoint: models/context/scene_sensor_net.pt
  context_engine:
    path: runs/engines/local/scene_sensor_net.engine
    sha256: null
    imgsz: 160
    min_batch_size: 1
    opt_batch_size: 8
    batch_size: 20
  engines:
    models/production/incremental_detection/three_class_base_detector.pt:
      path: runs/engines/local/three_class_base_detector.engine
      sha256: null
      imgsz: 640
      opt_height: 512
      opt_width: 640
      min_batch_size: 1
      opt_batch_size: 8
      batch_size: 20
    models/production/incremental_detection/incremental_detector.pt:
      path: runs/engines/local/incremental_detector.engine
      sha256: null
      imgsz: 512
      opt_height: 416
      opt_width: 512
      min_batch_size: 1
      opt_batch_size: 8
      batch_size: 20

model:
  weights: models/base/yolo11s_ir_sar_imgsz640.pt
  expected_sha256: 387d885a07797dea4a65900bc6f80ab380f1926eef622904331a151470b6f31c

assets:
  manifest: models/manifest.json
  generation_registry: models/generations.json
  checksums: models/SHA256SUMS.txt
  required:
    - models/base/yolo11s_ir_sar_imgsz640.pt
    - models/production/incremental_detection/three_class_base_detector.pt
    - models/production/incremental_detection/incremental_detector.pt
    - models/context/scene_sensor_net.pt
    - models/context/scene_sensor_metrics.json
    - models/manifest.json
    - models/generations.json
    - demo_artifacts/agent_demo_state.json

automation:
  audit_before_execute: true
  run_root: reports/agent_runs
  forbid_overwrite_fixed_reports: true
  allowed_risk_levels: [low]
  allowed_actions: [refresh_blackboard]
  max_steps_per_run: 8
  default_timeout_seconds: 300
  allowed_output_roots: [reports/agent_runs, reports/agent_blackboard, runs/submission]

submission:
  official_test_ready: false
  official_format_confirmed: false
  official_format: null
  official_test_dir: datasets_r1_base_test

blackboard:
  output_dir: reports/agent_blackboard
  state_json: blackboard_state.json
  report_md: agent_preparation_report.md
  demo_evidence: demo_artifacts/agent_demo_state.json

detector:
  name: yolo11s_imgsz640
  weights: models/base/yolo11s_ir_sar_imgsz640.pt
  config: configs/submission_infer_yolo11s_imgsz640.yaml
  candidate_status: gpu_smoke_verified
  metric: mAP50
  lock_all_map50: 0.91202
  lock_sar_map50: 0.88158
  lock_sar_soldier_map50: 0.72962

functional_models:
  registry: configs/functional_models.yaml
  required_count: 3

inputs:
  data_audit: reports/data_audit_summary.json
  metadata: reports/metadata.csv

modules:
  - name: data_gate
    status: ready
    owner: data
    inputs: [reports/data_audit_summary.json, reports/metadata.csv]
    outputs: [reports/data_audit_report.md, reports/metadata.csv]
  - name: detector
    status: active_production
    owner: model
    inputs: [models/generations.json]
    outputs: [models/production/incremental_detection]
  - name: incremental_manager
    status: active_production
    owner: incremental
    inputs: [models/generations.json, configs/incremental_detection_policy.yaml]
    outputs: [models/production/incremental_detection]
  - name: report_writer
    status: ready
    owner: documentation
    inputs: [reports]
    outputs: [reports/agent_blackboard]

policies:
  primary_model: use_incremental_detection_generation
  submission_format: pending_official_confirmation
  incremental_learning: mode_aware_incremental_data_only
  end_device: paused_until_ascend_board_ready

thresholds:
  min_new_class_map50: 0.60
  min_krr: 0.95
  preferred_export_conf: null
  fallback_export_conf: 0.01
  weak_class_map50: 0.80

incremental:
  task_type: incremental_object_detection
  primary_mode: class_incremental
  supported_modes: [class_incremental, target_incremental]
  learning_data_scope: incremental_dataset_only
  policy: configs/incremental_detection_policy.yaml
  expected_protocols: [incremental_detector]
  require_compliant_no_old_data: true

decision:
  default_context:
    sensor: sar
    scene: all
    class_focus: soldier
    official_test_ready: false
    official_format_confirmed: false
  outputs:
    decision_json: reports/agent_blackboard/agent_decision.json
    decision_md: reports/agent_blackboard/agent_decision_report.md
  actions:
    formal_submission:
      module: detector
      handler: formal_submission_pending_official_spec
      risk_level: high
      timeout_seconds: 0
      inputs: [models/generations.json, models/production/incremental_detection]
      outputs: [runs/submission]
    refresh_blackboard:
      module: report_writer
      handler: refresh_blackboard
      risk_level: low
      timeout_seconds: 60
      inputs: [configs/agent_pipeline.yaml]
      outputs: [reports/agent_blackboard/blackboard_state.json]

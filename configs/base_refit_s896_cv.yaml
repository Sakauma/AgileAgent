schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml

# 仅使用 475 张非测试旧类图像做连续块五折验证。该候选来自既有
# base_train/base_dev 高分配置；不读取 mixed_test/lock，且每折跑满预算。
model: yolo11s.pt
epochs: 160
project_root: runs/detect/base_refit_s896_cv
report_root: reports/base_refit_s896_cv

evaluation:
  imgsz: 896
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

candidates:
  fold_0:
    seed: 20260705
    overrides: &s896_train
      imgsz: 896
      multi_scale: 0.0
  fold_1:
    seed: 20260705
    overrides: *s896_train
  fold_2:
    seed: 20260705
    overrides: *s896_train
  fold_3:
    seed: 20260705
    overrides: *s896_train
  fold_4:
    seed: 20260705
    overrides: *s896_train

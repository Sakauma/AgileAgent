schema_version: 1
strict_config: configs/strict_class_incremental_3plus1.yaml

# 类别无关的时序 refit owner：每张训练帧增加最小目标裁剪，并将每个
# 已知序列最近 25% 的完整帧额外重复一次。该策略在 base_train 内部时序
# 留出上已优于单纯裁剪，正式 refit 仍不访问 mixed_test。
model: yolo11m.pt
epochs: 160
project_root: runs/detect/base_final_refit_recent_crop
report_root: reports/base_final_refit_recent_crop

evaluation:
  imgsz: 896
  batch: 1
  conf: 0.01
  iou: 0.70
  rect: true
  workers: 8

candidates:
  seed_a:
    seed: 20260705
    overrides:
      mosaic: 0.30
      close_mosaic: 30

schema_version: 1
kind: ascend310b_full_score_method

target:
  soc_version: Ascend310B1
  cann_version: 7.0.RC1
  precision: mixed_float16
  candidate_port: 8502
  formal_port: 8501

competition:
  accuracy_gates:
    base_map50_min: 0.80
    new_map50_min: 0.60
    krr_min: 0.95
  performance_gate:
    batch_image_count: 20
    batch_rounds: 3
    median_fps_min: 30.0
  diagnostics_only:
    - per_box_equivalence
    - business_json_equivalence
    - lock_precision
    - false_activation_rate
    - single_request_mean_ms
    - single_request_p95_ms
    - single_request_p99_ms
    - scene_sensor_accuracy
  validity_prerequisites:
    predictions_frozen_before_labels: true
    old_raw_image_count: 0
    old_raw_label_count: 0
    old_feature_cache_count: 0
    original_data_modified: false
    shared_max_drift: 0.0
    verify_asset_sha256: true

training:
  method: residual_adapter
  checkpoint_metric: map50
  export_checkpoints: [best, last]
  reference_export_checkpoint: last
  base_components_frozen:
    - backbone
    - neck
    - old_head
    - batch_norm_statistics
    - base_ema
  incremental_data_only: true
  input_size: 896
  epochs: 100
  batch: 4
  workers: 4
  seed: 20260705
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  deterministic: true
  patience: 0
  cache: false
  plots: true
  amp: true
  cos_lr: true
  warmup_epochs: 0.0
  warmup_bias_lr: 0.0
  close_mosaic: 10
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  multi_scale: 0.0
  degrees: 3.0
  translate: 0.15
  scale: 0.50
  fliplr: 0.50
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.30
  freeze: 23

export:
  model_layout: shared_backbone_dual_head_v1
  output_contract: raw_dual_head_v1
  input_name: images
  input_shape_nchw: [1, 3, 736, 896]
  input_shape_aipp_nhwc: [1, 736, 896, 3]
  aipp_config: configs/ascend310b/aipp/base_detector.cfg
  opset: 17
  logical_heads:
    old:
      owner: frozen_base_model
      class_map: {"0": 0, "1": 1, "2": 3}
      class_count: 3
      anchor_count: 13524
      output_index: 0
      output_shape: [1, 7, 13524]
    new:
      owner: incremental_model
      class_map: {"0": 2}
      class_count: 1
      anchor_count: 13524
      output_index: 1
      output_shape: [1, 5, 13524]

runtime:
  encoded_preprocessing: dvpp
  memory_mode: pageable
  schedule_mode: threaded_execute
  execution_mode: async_stream
  context_mode: fixed_neutral_v1
  neutral_context_score: 0.5
  detailed_event_timing: false
  fast_bounded_multipart: true
  neutral_scheduling_elision: true
  image_copy_elision: true

threshold_search:
  scoring_request_confidence: 0.01
  current_seed:
    old: 0.05
    new: 0.30
  stage_1_new:
    fixed_old: 0.05
    values: [0.20, 0.25, 0.30, 0.35, 0.40]
  stage_2_old:
    values: [0.03, 0.05, 0.10, 0.20, 0.30]
  cross_check_top_pairs: 2
  selection_order:
    - largest_minimum_accuracy_headroom
    - smallest_batch_fps_spread
    - highest_batch_median_fps
  no_full_score_policy: highest_fps_accuracy_pass_is_intermediate_only

benchmark:
  base_url: http://127.0.0.1:8502
  official_url: http://127.0.0.1:8501
  warmup_requests: 30
  batch_probe_size: 20
  batch_rounds: 3
  target_batch_fps: 30.0
  encoded: true
  run_web_pytest_on_board: false
  image_contract:
    root_glob: "*.png"
    width: 640
    height: 512
    bit_depth: 8
    color_types: [2, 6]

reference_result:
  date: "2026-08-16"
  runtime_commit: bc8def938523bb5856d96aa90f397468f208a4b6
  packaging_parent_commit: f7309a9b849c0c6f70ada8a9f512ff0a13e237dc
  old_candidate_confidence: 0.05
  new_candidate_confidence: 0.30
  base_map50: 0.8049006527998962
  new_map50: 0.6050327630685391
  krr: 1.0
  first_batch_median_fps: 30.066
  repeat_batch_median_fps: 30.080
  dual_head_onnx_sha256: 5d6651a25cdc227a6feaf3135d754f1d132f0740117156f9b6d0651c32104c5e
  dual_head_om_sha256: 3dd053e041c36225059cf6624eefebe5945ba6b8ca5bc0ca9d914448c4a54c89
  training_report_sha256: ce094cf5493ff76da92a62638292334126f4d39057a03499a52fcfd3ed1552dc
  export_manifest_sha256: a97fae923f997beeea9b22df920cb4be058da196039a8317d2f36f18b9e4e5d1
  export_checkpoint: last
  export_checkpoint_sha256: 6d1e7098015134615b32a7cedeeab9352bb83adf812f227b85044a3e64da9c6a
  training_best_checkpoint_sha256: fb44299eb6ad070e5330e88db975e1bebc1389cba229cd49466406dcf475b15d

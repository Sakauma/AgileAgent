[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-agent"
version = "0.1.0"
description = "Auditable IR/SAR rapid-learning agent workbench"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pillow>=9.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
workbench = ["pandas>=2.0", "starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.9"]
inference = ["numpy>=1.24", "opencv-python>=4.8", "ultralytics>=8.3.0"]
remote = ["pexpect"]
dev = ["pytest>=8.0", "httpx2>=2.5"]

[project.scripts]
agile-agent = "fair_agent.cli:main"

[tool.setuptools.packages.find]
include = ["fair_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-agent"
version = "0.1.0"
description = "Auditable IR/SAR rapid-learning agent workbench"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pillow",
  "pyyaml",
]

[project.optional-dependencies]
workbench = ["pandas", "streamlit"]
inference = ["opencv-python", "ultralytics>=8.3.0"]
remote = ["pexpect"]
dev = ["pytest"]

[project.scripts]
agile-agent = "fair_agent.cli:main"

[tool.setuptools.packages.find]
include = ["fair_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
